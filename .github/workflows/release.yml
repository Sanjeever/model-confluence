name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/sanjeever/model-confluence

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Check version and release notes
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/version.mjs check "$GITHUB_REF_NAME"
          node --test scripts/version.test.mjs

      - name: Check release state
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .draft')
          if [ -n "$draft" ] && [ "$draft" != true ]; then
            echo '该版本已经公开，请发布新版本。' >&2
            exit 1
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build web UI
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Test
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/linux_amd64 dist/darwin_arm64 dist/windows_amd64

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embedded_ui -trimpath -ldflags="-s -w" -o dist/linux_amd64/model-confluence ./cmd/model-confluence
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -tags embedded_ui -trimpath -ldflags="-s -w" -o dist/darwin_arm64/model-confluence ./cmd/model-confluence
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags embedded_ui -trimpath -ldflags="-s -w" -o dist/windows_amd64/model-confluence.exe ./cmd/model-confluence

          tar -C dist/linux_amd64 -czf "dist/model-confluence_${version}_linux_amd64.tar.gz" model-confluence
          tar -C dist/darwin_arm64 -czf "dist/model-confluence_${version}_darwin_arm64.tar.gz" model-confluence
          zip -j "dist/model-confluence_${version}_windows_amd64.zip" dist/windows_amd64/model-confluence.exe
          rm -rf dist/linux_amd64 dist/darwin_arm64 dist/windows_amd64

          cd dist
          sha256sum model-confluence_*.tar.gz model-confluence_*.zip > checksums.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_DRAFT: ${{ steps.release.outputs.draft }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [ "$EXISTING_DRAFT" != true ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file "$notes" --draft=false --latest
